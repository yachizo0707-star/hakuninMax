<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>百人一首 学習帖</title>
<style>
  :root{
    --washi:#faf5ea;
    --washi2:#f3ead9;
    --ink:#2c2620;
    --ink-soft:#5a4f42;
    --crimson:#a13d3d;
    --crimson-deep:#7f2d2d;
    --gold:#b5872b;
    --gold-soft:#e3cd93;
    --green-ok:#3f7a52;
    --red-ng:#b23b3b;
    --card-shadow: 0 4px 14px rgba(60,40,20,0.12);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at 20% 10%, #fffaf0 0%, var(--washi) 45%, var(--washi2) 100%);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    font-size:16px;
    -webkit-text-size-adjust:100%;
  }
  #app{
    min-height:100%;
    max-width:520px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
    display:flex;
    flex-direction:column;
  }
  h1.title{
    text-align:center;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:26px;
    letter-spacing:0.12em;
    color:var(--crimson-deep);
    margin:4px 0 2px;
  }
  p.subtitle{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 20px;
    letter-spacing:0.05em;
  }
  .section-label{
    font-size:13px;
    font-weight:bold;
    color:var(--gold);
    margin:18px 0 8px 4px;
    letter-spacing:0.08em;
    border-left:4px solid var(--gold);
    padding-left:8px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .choice-btn{
    -webkit-appearance:none;
    appearance:none;
    border:2px solid var(--gold-soft);
    background:#fff;
    color:var(--ink);
    border-radius:14px;
    padding:14px 10px;
    font-size:15px;
    font-weight:bold;
    text-align:center;
    box-shadow:var(--card-shadow);
    transition:transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .choice-btn:active{transform:scale(0.97);}
  .choice-btn.selected{
    border-color:var(--crimson);
    background:linear-gradient(180deg,#fff,#fdeeee);
    color:var(--crimson-deep);
  }
  .choice-btn small{display:block;font-weight:normal;font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .range-grid{grid-template-columns:1fr 1fr 1fr;}
  .range-btn{
    -webkit-appearance:none;
    border:2px solid var(--gold-soft);
    background:#fff;
    border-radius:12px;
    padding:12px 4px;
    font-size:14px;
    font-weight:bold;
    color:var(--ink);
    box-shadow:var(--card-shadow);
  }
  .range-btn.selected{
    border-color:var(--crimson);
    background:linear-gradient(180deg,#fff,#fdeeee);
    color:var(--crimson-deep);
  }
  .weak-btn{
    margin-top:10px;
    width:100%;
    -webkit-appearance:none;
    border:2px dashed var(--crimson);
    background:#fff8f4;
    color:var(--crimson-deep);
    border-radius:14px;
    padding:14px;
    font-size:15px;
    font-weight:bold;
  }
  .weak-btn:disabled{opacity:0.45;}
  .weak-count{
    display:inline-block;
    background:var(--crimson);
    color:#fff;
    border-radius:999px;
    font-size:12px;
    padding:1px 9px;
    margin-left:6px;
  }
  .start-btn{
    margin-top:22px;
    width:100%;
    -webkit-appearance:none;
    border:none;
    background:linear-gradient(135deg,var(--crimson),var(--crimson-deep));
    color:#fff;
    border-radius:16px;
    padding:16px;
    font-size:17px;
    font-weight:bold;
    letter-spacing:0.08em;
    box-shadow:0 6px 16px rgba(161,61,61,0.35);
  }
  .start-btn:disabled{
    background:#cbbfae;
    box-shadow:none;
  }
  .hidden{display:none !important;}

  /* quiz screen */
  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .progress-bar-outer{
    background:#e8dcc4;
    height:7px;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .progress-bar-inner{
    background:var(--crimson);
    height:100%;
    width:0%;
    transition:width .25s ease;
  }
  .mode-tag{
    display:inline-block;
    background:var(--washi2);
    border:1px solid var(--gold-soft);
    color:var(--gold);
    font-size:11px;
    font-weight:bold;
    border-radius:999px;
    padding:2px 10px;
    margin-bottom:10px;
  }
  .question-card{
    background:#fffdf8;
    border:1px solid var(--gold-soft);
    border-radius:18px;
    padding:22px 18px;
    box-shadow:var(--card-shadow);
    text-align:center;
    margin-bottom:18px;
    min-height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .question-text{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:19px;
    line-height:1.75;
    color:var(--ink);
    white-space:pre-line;
  }
  .question-text .blank{
    color:var(--crimson);
    font-weight:bold;
    letter-spacing:0.05em;
  }
  .answers{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .answer-btn{
    -webkit-appearance:none;
    text-align:left;
    border:2px solid var(--gold-soft);
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    font-size:15.5px;
    color:var(--ink);
    line-height:1.5;
    box-shadow:var(--card-shadow);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  .answer-btn:active{transform:scale(0.985);}
  .answer-btn.correct{
    border-color:var(--green-ok);
    background:linear-gradient(180deg,#fff,#eef7ef);
    color:var(--green-ok);
    font-weight:bold;
  }
  .answer-btn.wrong{
    border-color:var(--red-ng);
    background:linear-gradient(180deg,#fff,#fbecec);
    color:var(--red-ng);
    font-weight:bold;
  }
  .answer-btn.disabled{opacity:0.55;}
  .feedback{
    margin:14px 0 4px;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    min-height:22px;
  }
  .feedback.ok{color:var(--green-ok);}
  .feedback.ng{color:var(--red-ng);}
  .poem-meta{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .next-btn{
    margin-top:16px;
    width:100%;
    -webkit-appearance:none;
    border:none;
    background:var(--ink);
    color:#fff;
    border-radius:14px;
    padding:14px;
    font-size:15px;
    font-weight:bold;
  }
  .quit-link{
    text-align:center;
    margin-top:16px;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:underline;
    padding:6px;
  }

  /* result screen */
  .result-score{
    text-align:center;
    margin:20px 0 6px;
  }
  .result-score .num{
    font-size:44px;
    font-weight:bold;
    color:var(--crimson-deep);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  .result-score .label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .result-comment{
    text-align:center;
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .miss-list{
    background:#fff;
    border:1px solid var(--gold-soft);
    border-radius:14px;
    padding:6px 14px;
    margin-bottom:16px;
  }
  .miss-item{
    padding:10px 0;
    border-bottom:1px solid #f0e6d2;
    font-size:14px;
  }
  .miss-item:last-child{border-bottom:none;}
  .miss-item .mi-no{color:var(--gold);font-weight:bold;font-size:12px;margin-right:4px;}
  .miss-item .mi-kami{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
  .miss-item .mi-shimo{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink-soft);}
  .miss-item .mi-author{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn-row .half{
    flex:1;
    -webkit-appearance:none;
    border:2px solid var(--gold-soft);
    background:#fff;
    border-radius:14px;
    padding:14px;
    font-size:14.5px;
    font-weight:bold;
    color:var(--ink);
  }
  .btn-row .half.primary{
    border:none;
    background:linear-gradient(135deg,var(--crimson),var(--crimson-deep));
    color:#fff;
  }

  /* weak note management screen */
  .wn-item{
    background:#fff;
    border:1px solid var(--gold-soft);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .wn-text{flex:1;}
  .wn-text .wn-kami{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:14.5px;}
  .wn-text .wn-shimo{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:13.5px;color:var(--ink-soft);}
  .wn-text .wn-author{font-size:11.5px;color:var(--gold);margin-top:2px;}
  .wn-remove{
    -webkit-appearance:none;
    border:1px solid var(--red-ng);
    background:#fff;
    color:var(--red-ng);
    border-radius:10px;
    padding:8px 10px;
    font-size:12px;
    white-space:nowrap;
  }
  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:30px 10px;
  }
  .back-link{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:var(--crimson-deep);
    font-weight:bold;
    padding:10px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== ホーム画面 ===== -->
  <div id="screen-home">
    <h1 class="title">百人一首 学習帖</h1>
    <p class="subtitle">上の句・下の句・作者をおぼえよう</p>

    <div class="section-label">① 出題モードを選ぶ</div>
    <div class="grid" id="mode-grid">
      <button class="choice-btn" data-mode="kami2shimo">上の句 → 下の句<small>上の句から選ぶ</small></button>
      <button class="choice-btn" data-mode="shimo2kami">下の句 → 上の句<small>下の句から選ぶ</small></button>
      <button class="choice-btn" data-mode="fill">穴埋め問題<small>空欄をうめる</small></button>
      <button class="choice-btn" data-mode="author">作者を選ぶ<small>歌から作者を当てる</small></button>
    </div>

    <div class="section-label">② 出題範囲を選ぶ（20問ずつ）</div>
    <div class="grid range-grid" id="range-grid">
      <button class="range-btn" data-range="1-20">1〜20</button>
      <button class="range-btn" data-range="21-40">21〜40</button>
      <button class="range-btn" data-range="41-60">41〜60</button>
      <button class="range-btn" data-range="61-80">61〜80</button>
      <button class="range-btn" data-range="81-100">81〜100</button>
      <button class="range-btn" data-range="all">全100首</button>
    </div>

    <button class="weak-btn" id="weak-start-btn">
      苦手ノートを復習する <span class="weak-count" id="weak-count">0</span>
    </button>

    <button class="start-btn" id="start-btn" disabled>はじめる</button>

    <div class="quit-link" id="open-weak-manage">苦手ノートの中身を見る・整理する</div>
  </div>

  <!-- ===== クイズ画面 ===== -->
  <div id="screen-quiz" class="hidden">
    <div class="mode-tag" id="quiz-mode-tag"></div>
    <div class="quiz-top">
      <span id="quiz-progress-text">1 / 20</span>
      <span id="quiz-score-text">正解 0</span>
    </div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>

    <div class="question-card">
      <div class="question-text" id="question-text"></div>
    </div>

    <div class="answers" id="answers-wrap"></div>

    <div class="feedback" id="feedback-text"></div>
    <div class="poem-meta" id="poem-meta"></div>

    <button class="next-btn hidden" id="next-btn">次の問題へ</button>
    <div class="quit-link" id="quit-quiz-btn">やめてホームに戻る</div>
  </div>

  <!-- ===== 結果画面 ===== -->
  <div id="screen-result" class="hidden">
    <h1 class="title">結果発表</h1>
    <div class="result-score">
      <span class="num" id="result-score-num">0</span><span class="label"> / <span id="result-score-total">20</span> 問正解</span>
    </div>
    <div class="result-comment" id="result-comment"></div>

    <div id="result-miss-wrap"></div>

    <div class="btn-row">
      <button class="half" id="result-home-btn">ホームへ</button>
      <button class="half primary" id="result-retry-btn">もう一度この範囲</button>
    </div>
  </div>

  <!-- ===== 苦手ノート管理画面 ===== -->
  <div id="screen-weak-manage" class="hidden">
    <h1 class="title">苦手ノート</h1>
    <p class="subtitle">まちがえた歌が自動でここに残ります</p>
    <div id="weak-manage-list"></div>
    <div class="back-link" id="weak-manage-back">← ホームへ戻る</div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ---------- 百人一首 100首データ ---------- */
var POEMS = [
{id:1,kami:"秋の田のかりほの庵の苫をあらみ",shimo:"わが衣手は露にぬれつつ",author:"天智天皇"},

{id:10,kami:"これやこの行くも帰るも別れては",shimo:"知るも知らぬもあふ坂の関",author:"蝉丸"},

{id:43,kami:"逢ひ見てののちの心にくらぶれば",shimo:"昔はものを思はざりけり",author:"権中納言敦忠"},
{id:44,kami:"逢ふことの絶えてしなくはなかなかに",shimo:"人をも身をも恨みざらまし",author:"中納言朝忠"},

var POEM_BY_ID = {};
POEMS.forEach(function(p){ POEM_BY_ID[p.id]=p; });

/* ---------- 苦手ノート（localStorage） ---------- */
var WEAK_KEY = "hyakuninIsshu_weakList_v1";
function loadWeak(){
  try{
    var raw = localStorage.getItem(WEAK_KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    return arr.filter(function(id){ return POEM_BY_ID[id]; });
  }catch(e){ return []; }
}
function saveWeak(list){
  try{ localStorage.setItem(WEAK_KEY, JSON.stringify(list)); }catch(e){}
}
function addWeak(id){
  var list = loadWeak();
  if(list.indexOf(id) === -1){ list.push(id); saveWeak(list); }
  refreshWeakCount();
}
function removeWeak(id){
  var list = loadWeak().filter(function(x){ return x!==id; });
  saveWeak(list);
  refreshWeakCount();
}
function refreshWeakCount(){
  var n = loadWeak().length;
  document.getElementById("weak-count").textContent = String(n);
  document.getElementById("weak-start-btn").disabled = (n===0);
}

/* ---------- ユーティリティ ---------- */
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function sampleOthers(poem, n){
  var pool = POEMS.filter(function(p){ return p.id!==poem.id; });
  return shuffle(pool).slice(0,n);
}

/* ---------- 問題生成 ---------- */
function buildQuestion(poem, mode){
  if(mode==="kami2shimo"){
    var others = sampleOthers(poem,3);
    var choices = shuffle([poem.shimo].concat(others.map(function(p){return p.shimo;})));
    return {
      modeLabel:"上の句 → 下の句",
      questionText: poem.kami,
      choices: choices,
      correct: poem.shimo,
      meta: poem.id+"番 "+poem.author
    };
  }
  if(mode==="shimo2kami"){
    var others2 = sampleOthers(poem,3);
    var choices2 = shuffle([poem.kami].concat(others2.map(function(p){return p.kami;})));
    return {
      modeLabel:"下の句 → 上の句",
      questionText: poem.shimo,
      choices: choices2,
      correct: poem.kami,
      meta: poem.id+"番 "+poem.author
    };
  }
  if(mode==="author"){
    var others3 = sampleOthers(poem,3);
    var choices3 = shuffle([poem.author].concat(others3.map(function(p){return p.author;})));
    return {
      modeLabel:"作者を選ぶ",
      questionText: poem.kami+"\n"+poem.shimo,
      choices: choices3,
      correct: poem.author,
      meta: poem.id+"番"
    };
  }
  if(mode==="fill"){
    var useKami = Math.random()<0.5;
    var text = useKami ? poem.kami : poem.shimo;
    var maxLen = Math.min(7, text.length-2);
    var minLen = Math.min(4, maxLen);
    var blankLen = randInt(minLen, Math.max(minLen,maxLen));
    var startMax = text.length - blankLen;
    var start = randInt(0, Math.max(0,startMax));
    var blank = text.slice(start, start+blankLen);
    var displayed = text.slice(0,start) + "《" + "○".repeat(blankLen) + "》" + text.slice(start+blankLen);
    var fullDisplay = useKami ? (displayed+"\n"+poem.shimo) : (poem.kami+"\n"+displayed);

    // 距離を持つダミー候補（他の歌の同じ側の句から同じ長さで切り出す）
    var distractPool = sampleOthers(poem,6);
    var distractors = [];
    for(var i=0;i<distractPool.length && distractors.length<3;i++){
      var dp = distractPool[i];
      var dtext = useKami ? dp.kami : dp.shimo;
      if(dtext.length < blankLen) continue;
      var dstart = randInt(0, dtext.length-blankLen);
      var cand = dtext.slice(dstart, dstart+blankLen);
      if(cand!==blank && distractors.indexOf(cand)===-1){
        distractors.push(cand);
      }
    }
    while(distractors.length<3){
      var extra = POEMS[randInt(0,99)];
      var etext = useKami ? extra.kami : extra.shimo;
      if(etext.length>=blankLen){
        var es = randInt(0, etext.length-blankLen);
        var ec = etext.slice(es, es+blankLen);
        if(ec!==blank && distractors.indexOf(ec)===-1) distractors.push(ec);
      }
    }
    var choices4 = shuffle([blank].concat(distractors));
    return {
      modeLabel:"穴埋め問題（"+(useKami?"上の句":"下の句")+"）",
      questionText: fullDisplay,
      choices: choices4,
      correct: blank,
      meta: poem.id+"番 "+poem.author
    };
  }
}

/* ---------- 状態 ---------- */
var state = {
  mode:null,
  rangeKey:null,
  isWeakReview:false,
  queue:[],       // poem配列（出題順）
  index:0,
  score:0,
  missedIds:[],
  currentQuestion:null,
  answered:false
};

/* ---------- 画面切替 ---------- */
function showScreen(name){
  ["screen-home","screen-quiz","screen-result","screen-weak-manage"].forEach(function(id){
    document.getElementById(id).classList.toggle("hidden", id!==name);
  });
  window.scrollTo(0,0);
}

/* ---------- ホーム画面 ---------- */
var selectedMode = null;
var selectedRange = null;

document.getElementById("mode-grid").addEventListener("click", function(e){
  var btn = e.target.closest(".choice-btn");
  if(!btn) return;
  selectedMode = btn.getAttribute("data-mode");
  Array.prototype.forEach.call(document.querySelectorAll("#mode-grid .choice-btn"), function(b){
    b.classList.toggle("selected", b===btn);
  });
  updateStartBtn();
});

document.getElementById("range-grid").addEventListener("click", function(e){
  var btn = e.target.closest(".range-btn");
  if(!btn) return;
  selectedRange = btn.getAttribute("data-range");
  Array.prototype.forEach.call(document.querySelectorAll("#range-grid .range-btn"), function(b){
    b.classList.toggle("selected", b===btn);
  });
  updateStartBtn();
});

function updateStartBtn(){
  document.getElementById("start-btn").disabled = !(selectedMode && selectedRange);
}

function rangeToPoems(rangeKey){
  if(rangeKey==="all") return POEMS.slice();
  var parts = rangeKey.split("-");
  var lo = parseInt(parts[0],10), hi = parseInt(parts[1],10);
  return POEMS.filter(function(p){ return p.id>=lo && p.id<=hi; });
}

document.getElementById("start-btn").addEventListener("click", function(){
  if(!selectedMode || !selectedRange) return;
  startQuiz(selectedMode, rangeToPoems(selectedRange), false, selectedRange);
});

document.getElementById("weak-start-btn").addEventListener("click", function(){
  var ids = loadWeak();
  if(ids.length===0) return;
  var poems = ids.map(function(id){ return POEM_BY_ID[id]; }).filter(Boolean);
  var mode = selectedMode || "kami2shimo";
  startQuiz(mode, poems, true, "苦手ノート");
});

document.getElementById("open-weak-manage").addEventListener("click", function(){
  renderWeakManage();
  showScreen("screen-weak-manage");
});
document.getElementById("weak-manage-back").addEventListener("click", function(){
  showScreen("screen-home");
});

/* ---------- クイズ開始 ---------- */
function startQuiz(mode, poems, isWeakReview, rangeLabel){
  state.mode = mode;
  state.isWeakReview = isWeakReview;
  state.rangeKey = rangeLabel;
  state.queue = shuffle(poems);
  state.index = 0;
  state.score = 0;
  state.missedIds = [];
  showScreen("screen-quiz");
  renderQuestion();
}

function modeLabelJa(mode){
  return {kami2shimo:"上の句 → 下の句", shimo2kami:"下の句 → 上の句", fill:"穴埋め問題", author:"作者を選ぶ"}[mode] || "";
}

function renderQuestion(){
  state.answered = false;
  var poem = state.queue[state.index];
  var q = buildQuestion(poem, state.mode);
  state.currentQuestion = q;

  document.getElementById("quiz-mode-tag").textContent = q.modeLabel;
  document.getElementById("quiz-progress-text").textContent = (state.index+1)+" / "+state.queue.length;
  document.getElementById("quiz-score-text").textContent = "正解 "+state.score;
  document.getElementById("progress-bar").style.width = Math.round((state.index/state.queue.length)*100)+"%";

  document.getElementById("question-text").textContent = q.questionText;

  var wrap = document.getElementById("answers-wrap");
  wrap.innerHTML = "";
  q.choices.forEach(function(choiceText){
    var b = document.createElement("button");
    b.className = "answer-btn";
    b.textContent = choiceText;
    b.addEventListener("click", function(){ onAnswer(choiceText, b); });
    wrap.appendChild(b);
  });

  document.getElementById("feedback-text").textContent = "";
  document.getElementById("feedback-text").className = "feedback";
  document.getElementById("poem-meta").textContent = "";
  document.getElementById("next-btn").classList.add("hidden");
}

function onAnswer(choiceText, btnEl){
  if(state.answered) return;
  state.answered = true;
  var q = state.currentQuestion;
  var poem = state.queue[state.index];
  var isCorrect = (choiceText === q.correct);

  Array.prototype.forEach.call(document.querySelectorAll("#answers-wrap .answer-btn"), function(b){
    b.classList.add("disabled");
    if(b.textContent === q.correct) b.classList.add("correct");
    if(b===btnEl && !isCorrect) b.classList.add("wrong");
  });

  var fb = document.getElementById("feedback-text");
  if(isCorrect){
    state.score++;
    fb.textContent = "○ 正解！";
    fb.className = "feedback ok";
    if(state.isWeakReview){ removeWeak(poem.id); }
  }else{
    fb.textContent = "✕ 残念、正解は上の通りです";
    fb.className = "feedback ng";
    state.missedIds.push(poem.id);
    addWeak(poem.id);
  }
  document.getElementById("poem-meta").textContent =
    poem.id+"番　"+poem.kami+" ／ "+poem.shimo+"　（"+poem.author+"）";

  document.getElementById("quiz-score-text").textContent = "正解 "+state.score;
  document.getElementById("progress-bar").style.width = Math.round(((state.index+1)/state.queue.length)*100)+"%";
  document.getElementById("next-btn").classList.remove("hidden");
}

document.getElementById("next-btn").addEventListener("click", function(){
  state.index++;
  if(state.index >= state.queue.length){
    renderResult();
    showScreen("screen-result");
  }else{
    renderQuestion();
  }
});

document.getElementById("quit-quiz-btn").addEventListener("click", function(){
  showScreen("screen-home");
});

/* ---------- 結果画面 ---------- */
function renderResult(){
  document.getElementById("result-score-num").textContent = state.score;
  document.getElementById("result-score-total").textContent = state.queue.length;

  var rate = state.queue.length ? state.score/state.queue.length : 0;
  var comment;
  if(rate===1) comment = "満点！お見事です。";
  else if(rate>=0.8) comment = "よくできました！あと少し！";
  else if(rate>=0.5) comment = "だいぶ覚えてきました。苦手ノートで復習しよう。";
  else comment = "まずは苦手ノートを中心に復習してみましょう。";
  document.getElementById("result-comment").textContent = comment;

  var wrap = document.getElementById("result-miss-wrap");
  wrap.innerHTML = "";
  if(state.missedIds.length>0){
    var title = document.createElement("div");
    title.className = "section-label";
    title.textContent = "まちがえた歌（苦手ノートに追加済み）";
    wrap.appendChild(title);
    var list = document.createElement("div");
    list.className = "miss-list";
    state.missedIds.forEach(function(id){
      var p = POEM_BY_ID[id];
      var item = document.createElement("div");
      item.className = "miss-item";
      item.innerHTML =
        '<span class="mi-no">'+p.id+'番</span>'+
        '<div class="mi-kami">'+p.kami+'</div>'+
        '<div class="mi-shimo">'+p.shimo+'</div>'+
        '<div class="mi-author">'+p.author+'</div>';
      list.appendChild(item);
    });
    wrap.appendChild(list);
  }
  refreshWeakCount();
}

document.getElementById("result-home-btn").addEventListener("click", function(){
  showScreen("screen-home");
});
document.getElementById("result-retry-btn").addEventListener("click", function(){
  var poems = state.isWeakReview ? loadWeak().map(function(id){return POEM_BY_ID[id];}).filter(Boolean) : rangeToPoems(selectedRange);
  if(poems.length===0){ showScreen("screen-home"); return; }
  startQuiz(state.mode, poems, state.isWeakReview, state.rangeKey);
});

/* ---------- 苦手ノート管理画面 ---------- */
function renderWeakManage(){
  var ids = loadWeak();
  var wrap = document.getElementById("weak-manage-list");
  wrap.innerHTML = "";
  if(ids.length===0){
    var empty = document.createElement("div");
    empty.className = "empty-note";
    empty.textContent = "苦手ノートはまだ空です。クイズでまちがえると自動で追加されます。";
    wrap.appendChild(empty);
    return;
  }
  ids.slice().sort(function(a,b){return a-b;}).forEach(function(id){
    var p = POEM_BY_ID[id];
    if(!p) return;
    var item = document.createElement("div");
    item.className = "wn-item";
    item.innerHTML =
      '<div class="wn-text">'+
        '<div class="wn-kami">'+p.id+'. '+p.kami+'</div>'+
        '<div class="wn-shimo">'+p.shimo+'</div>'+
        '<div class="wn-author">'+p.author+'</div>'+
      '</div>'+
      '<button class="wn-remove">削除</button>';
    item.querySelector(".wn-remove").addEventListener("click", function(){
      removeWeak(id);
      renderWeakManage();
    });
    wrap.appendChild(item);
  });
}

/* ---------- 初期化 ---------- */
refreshWeakCount();
showScreen("screen-home");

})();
</script>
